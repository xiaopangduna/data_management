[project]
name = "data-management"
version = "0.1.0"
description = "Data management project"
authors = [
    { name = "黄文华", email = "18675381281@163.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fiftyone>=1.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_management"]

[dependency-groups]
dev = [
    "pytest>=9.0.1,<10.0.0",
]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = false
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)7s] %(name)s:%(lineno)d - %(message)s"
log_cli_date_format = "%H:%M:%S"
log_level = "DEBUG"
